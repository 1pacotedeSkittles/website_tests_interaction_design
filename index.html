<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drag and Drop - Formas</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- BARRA LATERAL (FERRAMENTAS) -->
        <div class="sidebar">
            <!-- Usamos data-shape para identificar o que estamos a arrastar -->
            <div class="tool shape-circle" data-shape="circle"></div>
            <div class="tool shape-triangle" data-shape="triangle"></div>
            <div class="tool shape-square" data-shape="square"></div>
            <div class="tool shape-line" data-shape="line"></div>
        </div>

        <!-- PALCO -->
        <div class="stage" id="stage">
            <!-- Os elementos arrastados vão aparecer aqui dentro -->
        </div>
        
    </div>
</body>
</html>
